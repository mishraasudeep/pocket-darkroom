      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: kit/PocketDarkroom
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: cp kit/PocketDarkroom/app/build/outputs/apk/release/app-release.apk PocketDarkroom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDarkroom-apk
          path: PocketDarkroom.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocket Darkroom build ${{ github.run_number }}
          files: PocketDarkroom.apk
